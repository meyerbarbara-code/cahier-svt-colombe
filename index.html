<title>Cahier SVT Colombe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600;700&display=swap">
<style>
:root{
  --bg:#f3eee2; --paper:#fffdf8; --ink:#1d2433; --ink2:#4b5568; --line:#dfe5f3; --margin:#eab0a8;
  --accent:#2b4a8b; --accent-ink:#ffffff; --red:#b3321f; --redbg:#fff1ee; --green:#2a7a4b; --greenbg:#e9f6ee; --amber:#9a6200; --amberbg:#fff4dc;
  --border:#e1d9c5; --soft:#eef2fb; --shadow:0 1px 2px rgba(40,30,10,.08),0 4px 14px rgba(40,30,10,.06);
  --sv-line:#5b6578; --sv-cell:#fbf1d8; --sv-nuc:#dbe8f8; --sv-dna:#2f5fa8; --sv-rna:#c8452e; --sv-ribo:#e4defa; --sv-ribo-s:#7a68b8;
  --sv-exon:#c8452e; --sv-intron:#eba938; --sv-lab:#ffffff; --sv-labt:#1d2433; --sv-hl:#c8452e;
  --sv-a1:#f2c14e; --sv-a2:#86c08a; --sv-a3:#74afdc; --sv-a4:#e993a8;
  --sv-boxg-f:#ffe3df; --sv-boxg-s:#c0392b; --sv-boxb-f:#e1eaff; --sv-boxb-s:#2b4a8b;
  --sv-chrp:#9bbdea; --sv-chrm:#eab0a4; --sv-band:#1d2433; --sv-bandb:#8e44ad; --sv-pore:#dbe8f8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151d; --paper:#1a1e2a; --ink:#e9ecf4; --ink2:#a9b3c7; --line:#283150; --margin:#6c3a3a;
  --accent:#9db8ff; --accent-ink:#0f1626; --red:#ff9985; --redbg:#3a2220; --green:#7fd8a0; --greenbg:#17301f; --amber:#f2c35d; --amberbg:#352a10;
  --border:#2a3042; --soft:#212842; --shadow:0 1px 2px rgba(0,0,0,.4);
  --sv-line:#8e9ab3; --sv-cell:#2a2a22; --sv-nuc:#23314d; --sv-dna:#8db4f5; --sv-rna:#ff9a82; --sv-ribo:#3a3560; --sv-ribo-s:#b2a4ee;
  --sv-exon:#ff9a82; --sv-intron:#f0b84a; --sv-lab:#1a1e2a; --sv-labt:#e9ecf4; --sv-hl:#ff8a70;
  --sv-a1:#c99a2e; --sv-a2:#4f9a62; --sv-a3:#4a86b8; --sv-a4:#c2607a;
  --sv-boxg-f:#3a2220; --sv-boxg-s:#ff9985; --sv-boxb-f:#1f2a4a; --sv-boxb-s:#9db8ff;
  --sv-chrp:#41689f; --sv-chrm:#a5584b; --sv-band:#e9ecf4; --sv-bandb:#c58be0; --sv-pore:#23314d;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151d; --paper:#1a1e2a; --ink:#e9ecf4; --ink2:#a9b3c7; --line:#283150; --margin:#6c3a3a;
  --accent:#9db8ff; --accent-ink:#0f1626; --red:#ff9985; --redbg:#3a2220; --green:#7fd8a0; --greenbg:#17301f; --amber:#f2c35d; --amberbg:#352a10;
  --border:#2a3042; --soft:#212842; --shadow:0 1px 2px rgba(0,0,0,.4);
  --sv-line:#8e9ab3; --sv-cell:#2a2a22; --sv-nuc:#23314d; --sv-dna:#8db4f5; --sv-rna:#ff9a82; --sv-ribo:#3a3560; --sv-ribo-s:#b2a4ee;
  --sv-exon:#ff9a82; --sv-intron:#f0b84a; --sv-lab:#1a1e2a; --sv-labt:#e9ecf4; --sv-hl:#ff8a70;
  --sv-a1:#c99a2e; --sv-a2:#4f9a62; --sv-a3:#4a86b8; --sv-a4:#c2607a;
  --sv-boxg-f:#3a2220; --sv-boxg-s:#ff9985; --sv-boxb-f:#1f2a4a; --sv-boxb-s:#9db8ff;
  --sv-chrp:#41689f; --sv-chrm:#a5584b; --sv-band:#e9ecf4; --sv-bandb:#c58be0; --sv-pore:#23314d;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;padding-inline:16px;padding-block:0 96px;-webkit-text-size-adjust:100%}
.wrap{max-width:780px;margin-inline:auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:10px;border-bottom:1px solid var(--border);margin-bottom:14px;flex-wrap:wrap}
header.top h1{font-size:1.05rem;margin:0;font-weight:700;letter-spacing:.01em}
header.top h1 small{display:block;font-weight:400;color:var(--ink2);font-size:.78rem}
select,input[type=text],textarea{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--border);border-radius:10px;padding:9px 11px;max-width:100%}
textarea{width:100%;min-height:96px;resize:vertical;line-height:1.5}
input[type=text]{width:100%}
select{padding:7px 9px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h2{font-size:1.35rem;margin:6px 0 10px;line-height:1.25;text-wrap:balance}
h3{font-size:1.08rem;margin:18px 0 8px;text-wrap:balance}
p{margin:0 0 10px}
.muted{color:var(--ink2)}
.small{font-size:.86rem}
.tag{display:inline-block;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:4px}
.card{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px;min-width:0}
.sheet{background-color:var(--paper);border-left:4px solid var(--margin)}
.mission{border:2px solid var(--accent);border-radius:16px;padding:16px 16px 14px;background:var(--paper);box-shadow:var(--shadow);margin-bottom:16px}
.obj{font-family:'Caveat',cursive;font-size:1.75rem;line-height:1.15;color:var(--ink);margin:2px 0 12px;text-wrap:balance}
.btn{font:inherit;font-weight:700;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 16px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:8px;text-align:left}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:6px 11px;min-height:36px;font-size:.92rem}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.no{background:transparent;border-color:var(--red);color:var(--red)}
.btn.half{background:transparent;border-color:var(--amber);color:var(--amber)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack>*+*{margin-top:10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--border);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{display:flex;gap:2px;width:100%;max-width:780px}
nav.tabs button{flex:1;min-width:0;background:none;border:0;color:var(--ink2);font:inherit;font-size:.78rem;padding:6px 2px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current=page]{color:var(--accent);background:var(--soft);font-weight:700}
.badge{display:inline-block;font-size:.74rem;font-weight:700;border-radius:99px;padding:2px 9px;border:1.5px solid currentColor}
.b-hi{color:var(--red)}.b-mid{color:var(--amber)}.b-lo{color:var(--ink2)}.b-ok{color:var(--green)}
kw,b.kw{font-weight:700;color:var(--accent)}
.blank{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--ink2)}
.def{padding:8px 0;border-bottom:1px dashed var(--border)}
.def:last-child{border-bottom:0}
.def .m{font-weight:700}
.piege{font-size:.9rem;background:var(--amberbg);border-left:4px solid var(--amber);padding:6px 10px;border-radius:6px;margin-top:6px}
.concl{border:2px solid var(--red);background:var(--redbg);border-radius:6px;padding:10px 12px;margin:12px 0}
.concl:before{content:'Conclusion · ';font-weight:700;color:var(--red);text-decoration:underline}
.ret{border:2px dashed var(--accent);border-radius:12px;padding:8px 12px;background:var(--soft);margin:12px 0;font-weight:700}
.ret:before{content:'À retenir : ';color:var(--accent)}
.eq{text-align:center;font-weight:700;font-size:1.1rem;padding:10px;background:var(--soft);border-radius:12px;margin:12px 0}
.ex{background:var(--greenbg);border-left:4px solid var(--green);padding:8px 12px;border-radius:6px;margin:10px 0}
table.t{border-collapse:collapse;width:100%;font-size:.93rem;margin:8px 0}
table.t th,table.t td{border:1.5px solid var(--border);padding:7px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--soft)}
.scroll{overflow-x:auto;max-width:100%}
.step{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.step i{font-style:normal;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:50%;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:.85rem;margin-top:2px}
.prog{display:flex;gap:6px;margin:10px 0 14px;flex-wrap:wrap}
.prog span{height:8px;flex:1;min-width:18px;border-radius:99px;background:var(--border)}
.prog span.on{background:var(--accent)}
.prog span.cur{background:var(--amber)}
.sv{width:100%;height:auto;display:block;max-width:100%;font-family:'Atkinson Hyperlegible',system-ui,sans-serif}
.svwrap{background:var(--paper);border:1.5px solid var(--border);border-radius:12px;padding:6px;overflow-x:auto;max-width:100%}
.svwrap .sv{min-width:600px}
.svwrap.hid .sv{filter:blur(14px) saturate(.2);opacity:.35}
.pad{touch-action:none;display:block;width:100%;border:2px solid var(--border);border-radius:12px;background:#fff;cursor:crosshair}
.chip{font:inherit;border:2px solid var(--border);background:var(--paper);color:var(--ink);border-radius:99px;padding:6px 13px;cursor:pointer;min-height:38px}
.chip[aria-pressed=true]{border-color:var(--accent);background:var(--soft);font-weight:700}
.chip.good{border-color:var(--green);background:var(--greenbg)}
.chip.bad{border-color:var(--red);background:var(--redbg)}
.choice{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:8px;cursor:pointer;min-height:48px}
.choice.good{border-color:var(--green);background:var(--greenbg)}
.choice.bad{border-color:var(--red);background:var(--redbg)}
.fb{padding:10px 12px;border-radius:10px;margin-top:10px}
.fb.good{background:var(--greenbg);border-left:4px solid var(--green)}
.fb.bad{background:var(--redbg);border-left:4px solid var(--red)}
.fb.info{background:var(--soft);border-left:4px solid var(--accent)}
.nt{display:flex;gap:8px;align-items:center;margin:6px 0}
.nt .n{min-width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.85rem}
.nt input{flex:1}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.bank span{background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:3px 9px;font-size:.9rem}
.seq{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:1.05rem;letter-spacing:.08em;word-break:break-all;line-height:1.9}
.seq u{text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-color:var(--sv-intron);background:var(--amberbg);border-radius:3px}
.seq .bad{background:var(--redbg);color:var(--red);font-weight:700;border-radius:3px}
.lvl{display:flex;gap:6px;margin:6px 0}
.grid-t1{font-size:.8rem}
.grid-t1 td,.grid-t1 th{padding:6px;font-weight:400}
.g1{background:#d7efdb}.g2{background:#d8e6fb}.g3{background:#fde0cf}.g4{background:#fdeeb8}
:root[data-theme="dark"] .g1,:root[data-theme="dark"] .g2,:root[data-theme="dark"] .g3,:root[data-theme="dark"] .g4{color:#101420}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .g1,:root:not([data-theme="light"]) .g2,:root:not([data-theme="light"]) .g3,:root:not([data-theme="light"]) .g4{color:#101420}}
.list-m{display:grid;gap:10px}
.mi{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1.5px solid var(--border);background:var(--paper);border-radius:12px;padding:11px 13px}
.mi .tx{min-width:0}
.mi .tt{font-weight:700}
.chk{display:flex;gap:10px;align-items:flex-start;margin:7px 0;cursor:pointer}
.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:none}
.cap{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap}
.err-i{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--border)}
.err-c{min-width:30px;height:30px;border-radius:8px;background:var(--redbg);color:var(--red);font-weight:700;display:flex;align-items:center;justify-content:center}
.err-i.fixed{opacity:.55}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.stat b{font-size:1.5rem;display:block;font-variant-numeric:tabular-nums}
.timer{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:.9rem}
details>summary{cursor:pointer;font-weight:700;color:var(--accent);padding:6px 0}
.code-t td{font-size:.78rem;padding:3px 5px;line-height:1.25}
.hl{background:var(--amberbg);padding:0 3px;border-radius:3px}
.sv text{fill:var(--sv-labt)}
.sv .cell{fill:var(--sv-cell);stroke:var(--sv-line);stroke-width:2}
.sv .nuc{fill:var(--sv-nuc);stroke:var(--sv-dna);stroke-width:3}
.sv .pore{fill:var(--sv-pore);stroke:none}
.sv .dna{fill:none;stroke:var(--sv-dna);stroke-width:3}
.sv .dnaLine{stroke:var(--sv-dna);stroke-width:5}
.sv .dnaA{fill:none;stroke:var(--sv-dna);stroke-width:4}
.sv .dnaB{fill:none;stroke:var(--sv-line);stroke-width:4}
.sv .rung{stroke:var(--sv-line);stroke-width:2}
.sv .gene{fill:none;stroke:var(--sv-line);stroke-width:2;stroke-dasharray:5 4}
.sv .rna{fill:none;stroke:var(--sv-rna);stroke-width:3.5}
.sv .rnaThick{fill:none;stroke:var(--sv-rna);stroke-width:5;stroke-linecap:round}
.sv .rnaLine{stroke:var(--sv-rna);stroke-width:4}
.sv .txtR{fill:var(--sv-rna)}
.sv .ribo{fill:var(--sv-ribo);stroke:var(--sv-ribo-s);stroke-width:2.5}
.sv .site{fill:none;stroke:var(--sv-ribo-s);stroke-width:2;stroke-dasharray:6 4}
.sv .enz{fill:var(--sv-ribo);stroke:var(--sv-ribo-s);stroke-width:2.5;opacity:.92}
.sv .aa1{fill:var(--sv-a1);stroke:var(--sv-line);stroke-width:1.5}.sv .aa2{fill:var(--sv-a2);stroke:var(--sv-line);stroke-width:1.5}.sv .aa3{fill:var(--sv-a3);stroke:var(--sv-line);stroke-width:1.5}.sv .aa4{fill:var(--sv-a4);stroke:var(--sv-line);stroke-width:1.5}
.sv .exon{fill:var(--sv-exon);stroke:var(--sv-line);stroke-width:1.5}
.sv .intron{fill:var(--sv-intron);stroke:var(--sv-line);stroke-width:1.5}
.sv .intronLine{fill:none;stroke:var(--sv-intron);stroke-width:9;stroke-linecap:round}
.sv .lasso{fill:none;stroke:var(--sv-intron);stroke-width:8}
.sv .boxG{fill:var(--sv-boxg-f);stroke:var(--sv-boxg-s);stroke-width:3}
.sv .boxB{fill:var(--sv-boxb-f);stroke:var(--sv-boxb-s);stroke-width:3}
.sv .big{stroke:var(--sv-line);stroke-width:6}
.sv .env{stroke:var(--sv-line);stroke-width:3;stroke-dasharray:3 6;stroke-linecap:round}
.sv .chrP{fill:var(--sv-chrp);stroke:var(--sv-line);stroke-width:2}
.sv .chrM{fill:var(--sv-chrm);stroke:var(--sv-line);stroke-width:2}
.sv .bandA{fill:var(--sv-band)}.sv .bandB{fill:var(--sv-bandb)}
.sv .loc{stroke:var(--sv-line);stroke-width:1.5;stroke-dasharray:3 5}
.sv .codonS{fill:var(--sv-a1);stroke:var(--sv-line);stroke-width:2}
.sv .codon{fill:var(--sv-a3);stroke:var(--sv-line);stroke-width:2;opacity:.85}
.sv .codonX{fill:var(--sv-a4);stroke:var(--sv-line);stroke-width:2}
.sv .bond{stroke:var(--sv-line);stroke-width:6;stroke-linecap:round}
.sv .arr{stroke:var(--sv-line);stroke-width:3;fill:none}
.sv .arrh{fill:var(--sv-line)}
.sv .lab rect{fill:var(--sv-lab);stroke:var(--sv-line);stroke-width:1.2}
.sv .lead{stroke:var(--sv-line);stroke-width:1.3;fill:none}
.sv .lab.miss rect{stroke:var(--sv-hl);stroke-width:2.5;fill:var(--redbg)}
.sv .num circle{fill:var(--accent);stroke:none}
.sv .num text{fill:var(--accent-ink);font-weight:700}
.sv .title{font-weight:700}
@media (max-width:520px){body{font-size:16px}.obj{font-size:1.55rem}}
@media print{nav.tabs,header.top{display:none}}
</style>

<script>
"use strict";
/* ---------- Données : chapitres intégrés (le chapitre peut aussi venir de la base 'lecons') ---------- */
const BUILTIN = [{"id": "ch1", "ordre": 1, "theme": "Thème 1 · La Terre, la vie et l'organisation du vivant · Partie A : Transmission, variation et expression du patrimoine génétique", "titre": "L'expression du patrimoine génétique", "court": "Chap. 1 · Expression du patrimoine génétique", "objectif": "Comprendre comment s'exprime l'information génétique portée par la molécule d'ADN.", "problematique": "Comment expliquer, au sein d'une même espèce, les variations visibles à plusieurs échelles ?", "sources": ["Cours (cahier de Colombe) : objectif, I, II, III", "Polycopiés : Génotype/phénotype, Homozygote/hétérozygote, Du gène à la protéine, Régulation", "TD2 « De l'ADN à la protéine » (classe inversée)", "TP1 (PTC, TAS2R38, doc 3)", "Test de connaissances SVT 1ère (septembre) corrigé"], "capacites": ["Identifier les différentes échelles du phénotype et les relier au génotype", "Expliquer et schématiser les différentes étapes conduisant à la fabrication d'une protéine", "Identifier, dans l'ordre, les 3 étapes de la synthèse des protéines", "Définir et expliquer ces étapes, donner leur localisation dans la cellule", "Avoir compris ce qu'est le code génétique", "Citer et expliquer quelques facteurs permettant de réguler l'activité des gènes"], "notions": [{"id": "phenotype", "mot": "Phénotype", "fiche": "f1", "core": true, "def": "Ensemble des {{caractères apparents}} d'un individu, qui s'observent à différentes {{échelles}} ({{moléculaire}}, {{cellulaire}} et {{macroscopique}}). Ex : groupe sanguin, taille, couleur des yeux.", "piege": "Le phénotype n'est pas « l'expression des gènes » en général : c'est ce qu'on OBSERVE, à plusieurs échelles (pas seulement ce qu'on voit à l'œil nu)."}, {"id": "genotype", "mot": "Génotype", "fiche": "f1", "core": true, "def": "Ensemble des {{allèles}} d'un individu (ou des allèles du ou des gènes étudiés).", "piege": "Piège : ce n'est pas « l'ensemble des gènes ». Le génotype se dit en ALLÈLES (ex : Rr, PAV//AVI)."}, {"id": "allele", "mot": "Allèle", "fiche": "f1", "core": true, "def": "{{Version}} d'un {{gène}}. Un individu a deux allèles pour un même gène (un hérité du père, un hérité de la mère).", "piege": "Gène = l'emplacement/l'information. Allèle = la version de ce gène."}, {"id": "gene", "mot": "Gène", "fiche": "f1", "core": false, "def": "Portion d'{{ADN}} (une {{séquence de nucléotides}}) qui porte une {{information génétique}} à l'origine d'un caractère. Ex : le gène TAS2R38.", "piege": "Un gène existe sous plusieurs versions : les allèles."}, {"id": "homozygote", "mot": "Individu homozygote", "fiche": "f2", "core": true, "def": "Individu qui possède {{2 allèles identiques}} pour le même gène. Ex : PAV//PAV ou AVI//AVI.", "piege": "Homo = pareil. On ne parle pas des chromosomes mais des ALLÈLES d'un même gène."}, {"id": "heterozygote", "mot": "Individu hétérozygote", "fiche": "f2", "core": true, "def": "Individu qui possède {{2 allèles différents}} pour le même gène. Ex : PAV//AVI.", "piege": "Hétéro = différent."}, {"id": "dominant", "mot": "Allèle dominant", "fiche": "f2", "core": true, "def": "Allèle qui {{s'exprime}} dans le phénotype même quand il est présent en {{un seul exemplaire}} (individu hétérozygote). Ex : PAV est dominant sur AVI.", "piege": "Dominant ne veut pas dire « le plus fréquent » : il s'exprime même à un seul exemplaire."}, {"id": "recessif", "mot": "Allèle récessif", "fiche": "f2", "core": true, "def": "Allèle qui ne s'exprime que s'il est présent en {{2 exemplaires}} (individu homozygote). Ex : pour être non sensible au PTC, il faut AVI//AVI.", "piege": "Récessif = masqué quand l'autre allèle est dominant."}, {"id": "echelles", "mot": "Échelles du phénotype", "fiche": "f3", "core": true, "def": "Le phénotype se décrit à 3 échelles : {{moléculaire}} (la protéine), {{cellulaire}} (les cellules) et {{macroscopique}} (l'organisme, les organes). Il dépend du génotype.", "piege": "Moléculaire = la protéine (récepteur, canal…). Cellulaire = ce que font les cellules. Macroscopique = ce que je constate sur la personne."}, {"id": "adn", "mot": "ADN", "fiche": "f4", "core": true, "def": "Molécule de {{2 chaînes}} de nucléotides ({{bicaténaire}}) en {{double hélice}}, avec les bases A, T, C, G et le sucre {{désoxyribose}}. Située dans le {{noyau}}.", "piege": "Dans l'ADN : T (thymine) et désoxyribose. Dans l'ARN : U (uracile) et ribose."}, {"id": "nucleotide", "mot": "Nucléotide", "fiche": "f4", "core": false, "def": "Unité de l'ADN : une {{base azotée}} (A, C, T ou G), un groupement {{phosphate}} et un {{sucre}} (désoxyribose).", "piege": "Il y a 4 types de nucléotides, selon la base."}, {"id": "complementarite", "mot": "Complémentarité des bases", "fiche": "f4", "core": true, "def": "Les bases azotées s'associent {{2 à 2}} : {{A avec T}} et {{C avec G}} (liaisons hydrogène entre les 2 chaînes). Dans l'ARN, A s'associe à {{U}}.", "piege": "Le brin d'ARN est le COMPLÉMENT du brin transcrit : A→U, T→A, C→G, G→C."}, {"id": "arn", "mot": "ARN", "fiche": "f4", "core": true, "def": "Molécule {{monocaténaire}} (1 chaîne) de nucléotides avec les bases A, U, C, G et le sucre {{ribose}}. Copie du message d'{{un seul gène}}. Présent dans le {{cytoplasme}} (après maturation).", "piege": "ARN = 1 chaîne, uracile, ribose. ADN = 2 chaînes, thymine, désoxyribose."}, {"id": "brintranscrit", "mot": "Brin transcrit", "fiche": "f4", "core": true, "def": "Brin d'ADN qui sert de {{modèle}} à la synthèse de l'ARN. L'ARN est {{complémentaire}} du brin transcrit.", "piege": "Le brin NON transcrit (dit « codant ») a la même séquence que l'ARN, avec T à la place de U. Si l'énoncé donne le brin « non codant », c'est le brin TRANSCRIT : il faut prendre son complémentaire."}, {"id": "transcription", "mot": "Transcription", "fiche": "f4", "core": true, "def": "Opération qui consiste à {{copier}} une information codée par l'{{ADN}} en une information codée sous forme de {{pré-ARN messager}}, grâce à l'{{ARN polymérase}}. Elle se déroule dans le {{noyau}} chez les eucaryotes.", "piege": "Transcription = noyau. Elle ne fabrique pas la protéine."}, {"id": "arnpol", "mot": "ARN polymérase", "fiche": "f4", "core": true, "def": "{{Complexe enzymatique}} qui déroule localement l'ADN, sépare les brins, puis incorpore des nucléotides {{complémentaires}} du brin transcrit : C en face de G, G en face de C, A en face de T et U en face de A.", "piege": "Plusieurs ARN polymérases transcrivent le même gène en même temps (« comme une usine »)."}, {"id": "prearn", "mot": "ARN pré-messager", "fiche": "f4", "core": true, "def": "Premier ARN produit par la {{transcription}} : il contient des parties {{codantes}} (exons) et {{non codantes}} (introns).", "piege": "Pré-ARN messager ≠ ARN messager : le second a subi la maturation."}, {"id": "exon", "mot": "Exon", "fiche": "f5", "core": true, "def": "Partie {{codante}} du pré-ARN messager : elle est {{conservée}} et comporte l'information nécessaire à la synthèse des séquences d'acides aminés.", "piege": "Exon = Exprimé (conservé). Intron = Intrus (éliminé)."}, {"id": "intron", "mot": "Intron", "fiche": "f5", "core": true, "def": "Partie {{non codante}} du pré-ARN messager, {{éliminée}} (excisée) lors de la maturation.", "piege": "Dans un énoncé, les introns sont soulignés : on les retire avant de traduire."}, {"id": "maturation", "mot": "Maturation (épissage)", "fiche": "f5", "core": true, "def": "Étape qui {{élimine}} les parties non codantes ({{introns}}) du pré-ARN messager et forme un ARN {{messager}} mature, qui migre ensuite dans le {{cytoplasme}}. Elle a lieu dans le {{noyau}}.", "piege": "Maturation = épissage = on enlève les introns. Certains ARN messagers sont produits directement par la transcription."}, {"id": "alternatif", "mot": "Épissage alternatif", "fiche": "f5", "core": false, "def": "Un même pré-ARN messager peut subir des {{maturations différentes}} et donc être à l'origine de {{plusieurs protéines différentes}}.", "piege": "Les exons ne sont pas toujours tous conservés."}, {"id": "arnm", "mot": "ARN messager", "fiche": "f5", "core": true, "def": "ARN {{mature}} (sans introns) qui sort du {{noyau}} par les pores nucléaires et migre dans le {{cytoplasme}}, où il est traduit.", "piege": "C'est lui qui est lu par le ribosome."}, {"id": "traduction", "mot": "Traduction", "fiche": "f6", "core": true, "def": "Passage d'une information codée en {{nucléotides}} (ARNm) à une information codée en {{acides aminés}} (protéine), à l'aide des {{ribosomes}}, dans le {{cytoplasme}}. Elle commence toujours par un codon spécifique ({{AUG}}) et s'arrête à un {{codon stop}}.", "piege": "Traduction = cytoplasme, ribosome, codon par codon."}, {"id": "ribosome", "mot": "Ribosome", "fiche": "f6", "core": true, "def": "Structure du {{cytoplasme}} qui se place sur l'ARN messager et le lit de {{codon en codon}}. Il possède 2 sites : le site {{P}} et le site {{A}}.", "piege": "Un ou plusieurs ribosomes peuvent lire le même ARNm (polysome)."}, {"id": "codon", "mot": "Codon", "fiche": "f6", "core": true, "def": "Suite de {{3 nucléotides}} (triplet) de l'ARN messager qui code pour {{un acide aminé}}.", "piege": "1 codon = 3 nucléotides = 1 acide aminé. (Pas « 3 codons = 1 acide aminé » !)"}, {"id": "codegen", "mot": "Code génétique", "fiche": "f6", "core": true, "def": "Système de correspondance entre la séquence de {{nucléotides}} d'un gène et la séquence d'{{acides aminés}} de la protéine (64 codons). Il est {{univoque}}, {{redondant}} et {{universel}}.", "piege": "Univoque : 1 codon → 1 seul acide aminé. Redondant : plusieurs codons → 1 même acide aminé. Universel : identique chez tous les êtres vivants."}, {"id": "aug", "mot": "Codon d'initiation", "fiche": "f6", "core": true, "def": "Codon {{AUG}} : la traduction commence toujours par lui. Il code pour la {{méthionine}}.", "piege": "Le codon d'initiation, c'est AUG. Les codons stop sont UAA, UAG et UGA."}, {"id": "stop", "mot": "Codon stop", "fiche": "f6", "core": true, "def": "Codon ({{UAA}}, {{UAG}} ou {{UGA}}) qui ne code aucun acide aminé : quand le ribosome le lit, la {{traduction s'achève}} et la protéine se détache.", "piege": "Après le codon stop, on ne traduit plus."}, {"id": "peptidique", "mot": "Liaison peptidique", "fiche": "f6", "core": true, "def": "Liaison qui s'établit entre deux {{acides aminés}} successifs lors de l'{{élongation}} de la chaîne.", "piege": "Une chaîne d'acides aminés = polypeptide = protéine."}, {"id": "proteine", "mot": "Protéine", "fiche": "f6", "core": true, "def": "Macromolécule formée d'un {{enchaînement d'acides aminés}} dont la séquence détermine la {{fonction}} (structure, enzyme, récepteur…). Une modification de la séquence peut modifier ou supprimer son activité.", "piege": "Exemple : le récepteur PAV est fonctionnel (le PTC peut s'y fixer), le récepteur AVI ne l'est pas."}, {"id": "phmol", "mot": "Phénotype moléculaire", "fiche": "f3", "core": true, "def": "{{Séquences en acides aminés}}, structures et propriétés des {{protéines}} d'un individu.", "piege": "Lien avec le génotype : le code génétique."}, {"id": "phcell", "mot": "Phénotype cellulaire", "fiche": "f3", "core": true, "def": "{{Caractéristiques}}, propriétés et fonctionnement des {{cellules}} d'un individu. Lien avec le moléculaire : le lien entre protéines et activité cellulaire.", "piege": "Ex : les cellules sensorielles qui expriment le récepteur PAV."}, {"id": "phmacro", "mot": "Phénotype macroscopique", "fiche": "f3", "core": true, "def": "Caractères apparents à l'échelle de l'{{organisme}} ; fonctionnement des {{organes}}.", "piege": "Ex : ressentir fortement l'amertume des brocolis."}, {"id": "regulation", "mot": "Régulation de l'expression des gènes", "fiche": "f7", "core": true, "def": "Toutes les cellules possèdent la {{même information génétique}}, mais n'utilisent qu'{{une partie du génome}} selon leurs besoins. L'activité des gènes est modulée par des facteurs {{internes}} (hormones, développement) ou {{externes}} (température, environnement).", "piege": "Ex : le gène TAS2R38 n'est exprimé que dans les cellules des bourgeons du goût ; chez la tortue, la température influence le sexe."}], "fiches": [{"id": "f1", "titre": "Génotype et phénotype", "mission": "Je sais définir phénotype, génotype et allèle avec mes mots.", "blocs": [{"k": "h", "t": "Du génotype au phénotype"}, {"k": "n", "ids": ["phenotype", "genotype", "allele", "gene"]}, {"k": "eq", "t": "Génotype + environnement → Phénotype", "s": "Le phénotype dépend des gènes, mais aussi parfois de l'environnement."}, {"k": "tab", "head": ["", "Génotype", "Phénotype"], "rows": [["Nature", "information génétique", "caractère observable"], ["Où ?", "dans l'ADN", "chez l'individu"], ["Exemple", "Bb", "yeux marron"]]}, {"k": "ex", "t": "Génotype Rr → phénotype « fleur rouge » : l'allèle R permet l'expression de la couleur rouge."}, {"k": "ret", "t": "Le génotype est le « code », le phénotype est le « résultat visible »."}], "schemas": ["homolog"]}, {"id": "f2", "titre": "Allèles : homozygote, hétérozygote, dominant, récessif", "mission": "Je sais dire si un individu est homozygote ou hétérozygote et quel allèle s'exprime.", "blocs": [{"k": "h", "t": "Les allèles d'un gène (TP1, doc 3)"}, {"k": "n", "ids": ["homozygote", "heterozygote", "dominant", "recessif"]}, {"k": "tab", "head": ["Critères", "Homozygote", "Hétérozygote"], "rows": [["Définition", "2 allèles identiques pour un gène", "2 allèles différents pour un gène"], ["Allèles", "identiques (A et A ou a et a)", "différents (A et a)"], ["Exemples", "AA ou aa · PAV//PAV ou AVI//AVI", "Aa · PAV//AVI"]]}, {"k": "ex", "t": "AA = fleur rouge · Aa = fleur rouge · aa = fleur blanche. Ici l'allèle A est dominant sur l'allèle a."}, {"k": "ret", "t": "Homozygote = 2 allèles identiques ; hétérozygote = 2 allèles différents. Chaque paire de chromosomes homologues contient un chromosome d'origine paternelle et un d'origine maternelle."}], "schemas": ["homolog"]}, {"id": "f3", "titre": "Les échelles du phénotype", "mission": "Je sais relier un génotype à ses 3 échelles de phénotype (exemple : le goût amer).", "blocs": [{"k": "h", "t": "Le phénotype se définit à différentes échelles"}, {"k": "n", "ids": ["echelles", "phmol", "phcell", "phmacro"]}, {"k": "p", "t": "Exemple du PTC : il existe différents allèles du gène TAS2R38, comme AVI et PAV. L'allèle PAV possède 3 nucléotides mutés par rapport à AVI (génotype). Cela entraîne la formation d'une protéine, le récepteur, avec 3 acides aminés différents (échelle moléculaire du phénotype)."}, {"k": "p", "t": "Sur le récepteur PAV, le PTC peut se fixer (récepteur fonctionnel) ; il ne se fixe pas sur le récepteur AVI (non fonctionnel). Les individus dont les cellules sensorielles des bourgeons du goût expriment le récepteur PAV (échelle cellulaire) ressentent fortement le goût amer (échelle macroscopique) des brocolis, alors que ceux qui ont le récepteur AVI ne ressentent pas l'amertume."}, {"k": "concl", "t": "Le phénotype se définit à différentes échelles et dépend du génotype."}], "schemas": ["echelles"]}, {"id": "f4", "titre": "De l'ADN à l'ARN : la transcription", "mission": "Je sais expliquer la transcription et écrire l'ARN à partir d'un brin d'ADN.", "blocs": [{"k": "h", "t": "Nécessité d'un intermédiaire entre l'ADN et la protéine"}, {"k": "p", "t": "La séquence des nucléotides de l'ADN est une information nécessaire à la synthèse des protéines. Or l'ADN est situé dans le noyau et la synthèse des protéines a lieu dans le cytoplasme : il existe donc au moins un intermédiaire capable de sortir du noyau, l'ARN."}, {"k": "tab", "head": ["Molécule", "ADN", "ARN"], "rows": [["Localisation", "Noyau", "Cytoplasme"], ["Nombre de chaînes", "2 chaînes en double hélice (bicaténaire)", "1 chaîne (monocaténaire)"], ["Longueur", "l'ensemble des gènes (≈ 23 000 gènes)", "les séquences codantes d'un seul gène"], ["Bases azotées", "A, T, C et G", "A, U, C et G (uracile)"], ["Sucre", "Désoxyribose", "Ribose"]]}, {"k": "n", "ids": ["adn", "nucleotide", "complementarite", "arn", "brintranscrit", "arnpol", "prearn", "transcription"]}, {"k": "concl", "t": "La transcription est l'opération qui consiste à copier une information (codée par l'ADN : le brin transcrit de l'ADN servant de modèle sera complémentaire du brin synthétisé) en une information codée sous forme de pré-ARN messager grâce à l'ARN polymérase. La transcription se déroule dans le noyau chez les eucaryotes."}], "schemas": ["transcription"]}, {"id": "f5", "titre": "La maturation du pré-ARN messager", "mission": "Je sais dire ce qu'on enlève (introns) et ce qu'on garde (exons).", "blocs": [{"k": "h", "t": "Deuxième étape : la maturation éventuelle"}, {"k": "n", "ids": ["intron", "exon", "maturation", "arnm", "alternatif"]}, {"k": "concl", "t": "Dans une cellule eucaryote, l'information génétique est formée de séquences codantes séparées par des séquences non codantes. Dans de nombreux cas, la transcription produit d'abord un ARN pré-messager ; une maturation (ou épissage) assure l'élimination des parties non codantes et la formation d'un ARN mature qui migrera ensuite dans le cytoplasme. Un même ARN pré-messager peut subir des maturations différentes et donc être à l'origine de plusieurs protéines différentes (épissage alternatif)."}], "schemas": ["maturation"]}, {"id": "f6", "titre": "La traduction et le code génétique", "mission": "Je sais traduire un ARN messager en protéine avec le tableau du code génétique.", "blocs": [{"k": "h", "t": "Troisième étape : la traduction de l'ARNm dans le cytoplasme"}, {"k": "n", "ids": ["proteine", "traduction", "ribosome", "codon", "aug", "stop", "peptidique", "codegen"]}, {"k": "steps", "items": [["Initiation", "Dans le ribosome, le 1er codon se place sur le 1er site. Le codon d'initiation est toujours AUG ; l'acide aminé correspondant, la méthionine, se positionne en face."], ["Élongation", "Sur le 2e site se place le triplet suivant et le 2e acide aminé vient en face. Une liaison peptidique s'établit entre cet acide aminé et le précédent. Le ribosome se déplace de triplet en triplet le long de l'ARNm (la chaîne s'allonge)."], ["Terminaison", "Quand le ribosome lit un codon stop (UAG, UAA, UGA), la traduction s'achève. La chaîne d'acides aminés appelée protéine se détache."]]}, {"k": "code"}, {"k": "concl", "t": "La traduction permet de passer d'une information codée en nucléotides (ARNm) à une information différente codée en acides aminés (protéines) à l'aide des ribosomes. La traduction commence toujours par un codon spécifique. Elle se poursuit de codon en codon, ajoutant les acides aminés correspondants (code génétique) jusqu'à la lecture d'un codon-stop. La traduction, dernière étape de la synthèse des protéines, se déroule dans le cytoplasme."}, {"k": "ret", "t": "Du gène à la protéine : transcription (noyau) → maturation (noyau) → traduction (cytoplasme)."}], "schemas": ["global", "traduction"]}, {"id": "f7", "titre": "La régulation de l'expression des gènes", "mission": "Je sais citer 2 facteurs qui régulent l'activité des gènes, avec un exemple chacun.", "blocs": [{"k": "h", "t": "Les gènes ne sont pas tous exprimés tout le temps"}, {"k": "n", "ids": ["regulation"]}, {"k": "ex", "t": "Facteur externe : la température. Chez la tortue, 27 °C et 30 °C n'aboutissent pas au même sexe (doc 1). Facteur interne : une hormone. Chez le tilapia, la testostérone modifie la quantité d'ARNm de certaines hormones (doc 2)."}, {"k": "concl", "t": "Le phénotype résulte de l'ensemble des produits de l'ADN (ARN et protéines) présents dans la cellule. Il dépend du patrimoine génétique (génotype) et de son expression. L'activité des gènes de la cellule est régulée sous l'influence interne de l'organisme (développement) et externe (réponses aux conditions de l'environnement)."}], "schemas": ["echelles"]}], "schemas": [{"id": "global", "titre": "De l'ADN à la protéine", "titreCourt": "De l'ADN à la protéine", "fiche": "f6", "titreAttendu": "De l'ADN à la protéine (l'expression du patrimoine génétique)" ": "cellulaire", "q": "Que se passe-t-il dans les cellules ?", "m": ["Les cellules sensorielles des bourgeons du goût expriment le récepteur PAV", "Les cellules sensorielles expriment le récepteur AVI"], "kw": [["cellules", "pav"], ["cellules", "avi"]]}, {"e": "moléculaire", "q": "Quelle protéine est produite ?", "m": ["Récepteur PAV (protéine) : le PTC peut s'y fixer, il est fonctionnel", "Récepteur AVI (protéine) : le PTC ne s'y fixe pas, non fonctionnel (3 acides aminés différents)"], "kw": [["pav", "fix"], ["avi", "fix"]]}, {"e": "génotype", "q": "Quels allèles ?", "m": ["Au moins un allèle PAV (PAV//PAV ou PAV//AVI) : PAV est dominant", "Deux allèles AVI (AVI//AVI) : AVI est récessif"], "kw": [["pav"], ["avi"]]}]}, {"id": "muco", "titre": "La mucoviscidose", "intro": "« La mucoviscidose est une maladie génétique caractérisée par des difficultés respiratoires sévères dues à la présence d'un mucus très épais qui engorge les poumons, ainsi que par des troubles digestifs. Au niveau des cellules des épithéliums respiratoires, la sortie d'ions chlorure et d'eau permet habituellement de fluidifier le mucus. Chez les personnes atteintes, ces échanges d'eau et d'ions ne se font pas correctement, ce qui rend le mucus visqueux. Cette anomalie est due à une modification de la protéine CFTR, un canal membranaire responsable du transport du chlorure. Chez les individus malades, la protéine CFTR est absente ou non fonctionnelle en raison d'une mutation du gène CFTR. »", "col": ["Individu sain", "Individu malade"], "rows": [{"e": "macroscopique", "q": "Qu'est-ce qu'on constate sur la personne ?", "m": ["Il respire normalement, bonne santé, pas de troubles digestifs", "Difficultés respiratoires sévères et troubles digestifs"], "kw": [["respir"], ["respir", "digest"]]}, {"e": "cellulaire", "q": "Que font les cellules des épithéliums respiratoires ?", "m": ["Sortie d'ions chlorure et d'eau : le mucus est fluide", "Les échanges d'eau et d'ions ne se font pas correctement : le mucus est épais et visqueux"], "kw": [["chlorure", "fluid"], ["mucus", "visqueux"]]}, {"e": "moléculaire", "q": "Que devient la protéine CFTR ?", "m": ["Protéine CFTR (canal membranaire) présente et fonctionnelle : elle transporte le chlorure", "Protéine CFTR absente ou non fonctionnelle"], "kw": [["cftr", "fonctionnel"], ["cftr", "absente"]]}, {"e": "génotype", "q": "Que dire du gène CFTR ?", "m": ["Gène CFTR sans mutation", "Mutation du gène CFTR (allèle muté)"], "kw": [["cftr"], ["mutation"]]}]}], "qcm": [{"q": "Le génotype d'un individu, c'est :", "c": ["l'ensemble de ses allèles (pour le ou les gènes étudiés)", "l'ensemble de ses caractères visibles", "l'ensemble de ses protéines", "son nombre de chromosomes"], "b": 0, "e": "Le génotype = l'ensemble des allèles. Les caractères observables, c'est le phénotype.", "code": "D", "ref": "genotype"}, {"q": "Un individu est homozygote pour un gène quand il possède :", "c": ["deux allèles différents", "deux allèles identiques", "un seul allèle", "deux gènes différents"], "b": 1, "e": "Homozygote = 2 allèles identiques (ex : PAV//PAV). Hétérozygote = 2 allèles différents.", "code": "D", "ref": "homozygote"}, {"q": "Un individu PAV//AVI est sensible au PTC. Cela montre que l'allèle PAV est :", "c": ["récessif", "dominant", "muté", "absent"], "b": 1, "e": "PAV s'exprime même en un seul exemplaire : il est dominant. AVI est récessif (il faut AVI//AVI pour être non sensible).", "code": "D", "ref": "dominant"}, {"q": "Quelle échelle du phénotype correspond au récepteur au PTC ?", "c": ["moléculaire", "cellulaire", "macroscopique", "génotypique"], "b": 0, "e": "Le récepteur est une protéine : échelle moléculaire. Cellulaire : les cellules sensorielles qui l'expriment. Macroscopique : ressentir l'amertume.", "code": "E", "ref": "echelles"}, {"q": "Où se déroule la transcription chez un eucaryote ?", "c": ["dans le cytoplasme", "dans le noyau", "dans les ribosomes", "dans la membrane"], "b": 1, "e": "La transcription (ADN → pré-ARN messager) a lieu dans le noyau, là où se trouve l'ADN.", "code": "S", "ref": "transcription"}, {"q": "Quel est l'ordre correct des étapes de la synthèse d'une protéine ?", "c": ["traduction → transcription → maturation", "transcription → traduction → maturation", "transcription → maturation → traduction", "maturation → transcription → traduction"], "b": 2, "e": "Transcription (noyau) → maturation (noyau) → traduction (cytoplasme).", "code": "S", "ref": "global"}, {"q": "Que fait l'ARN polymérase ?", "c": ["elle assemble les acides aminés", "elle synthétise l'ARN en copiant le brin transcrit", "elle coupe les introns", "elle lit les codons"], "b": 1, "e": "L'ARN polymérase déroule l'ADN et incorpore des nucléotides complémentaires du brin transcrit. Les ribosomes assemblent les acides aminés.", "code": "S", "ref": "arnpol"}, {"q": "Le brin transcrit d'ADN est TACGGT. L'ARN pré-messager correspondant est :", "c": ["AUGCCA", "ATGCCA", "UACGGU", "AUGCCU"], "b": 0, "e": "On prend le complémentaire de chaque base : T→A, A→U, C→G, G→C, G→C, T→A : AUGCCA. Dans l'ARN, il n'y a pas de T.", "code": "C", "ref": "complementarite"}, {"q": "Quelle base est présente dans l'ARN mais pas dans l'ADN ?", "c": ["thymine", "uracile", "adénine", "guanine"], "b": 1, "e": "L'ARN contient de l'uracile (U) à la place de la thymine (T).", "code": "D", "ref": "arn"}, {"q": "Que se passe-t-il pendant la maturation ?", "c": ["les exons sont éliminés", "les introns sont éliminés", "l'ADN est copié", "les acides aminés sont assemblés"], "b": 1, "e": "Maturation (épissage) : on élimine les introns (non codants) et on garde les exons (codants).", "code": "S", "ref": "maturation"}, {"q": "Un codon, c'est :", "c": ["3 acides aminés", "3 nucléotides qui codent un acide aminé", "1 nucléotide", "une protéine"], "b": 1, "e": "1 codon = 3 nucléotides = 1 acide aminé.", "code": "C", "ref": "codon"}, {"q": "Par quel codon commence toujours la traduction ?", "c": ["UAA", "UGA", "AUG", "GCA"], "b": 2, "e": "AUG /* ---------- Code génétique ---------- */
const BASES='UCAG', AA1='FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG';
const AA3={F:'Phe',L:'Leu',S:'Ser',Y:'Tyr','*':'Stop',C:'Cys',W:'Trp',P:'Pro',H:'His',Q:'Gln',R:'Arg',I:'Ile',M:'Met',T:'Thr',N:'Asn',K:'Lys',V:'Val',A:'Ala',D:'Asp',E:'Glu',G:'Gly'};
const AAFR={Phe:'phenylalanine',Leu:'leucine',Ser:'serine',Tyr:'tyrosine',Cys:'cysteine',Trp:'tryptophane',Pro:'proline',His:'histidine',Gln:'glutamine',Arg:'arginine',Ile:'isoleucine',Met:'methionine',Thr:'threonine',Asn:'asparagine',Lys:'lysine',Val:'valine',Ala:'alanine',Asp:'acide aspartique',Glu:'acide glutamique',Gly:'glycine',Stop:'stop'};
const codonAA = c => AA3[AA1[BASES.indexOf(c[0])*16+BASES.indexOf(c[1])*4+BASES.indexOf(c[2])]];
const ALLC = []; for(const a of BASES) for(const b of BASES) for(const c of BASES) ALLC.push(a+b+c);
const SENSE = ALLC.filter(c=>codonAA(c)!=='Stop' && c!=='AUG');
const D2R = {A:'U',T:'A',C:'G',G:'C'}, R2D = {A:'T',U:'A',G:'C',C:'G'}, DD = {A:'T',T:'A',C:'G',G:'C'};
function codeTable(){
  let h='<div class="scroll"><table class="t code-t"><tr><th rowspan="2">1<sup>re</sup> base</th><th colspan="4">2<sup>e</sup> base</th></tr><tr>'+[...BASES].map(b=>'<th>'+b+'</th>').join('')+'</tr>';
  for(const a of BASES){ h+='<tr><th>'+a+'</th>'; for(const b of BASES){ h+='<td>'; for(const c of BASES){ const cod=a+b+c; const aa=codonAA(cod); h+=cod+' '+(aa==='Stop'?'<b>STOP</b>':aa)+'<br>'; } h+='</td>'; } h+='</tr>'; }
  return h+'</table></div><p class="small muted">AUG = méthionine = codon d\'initiation. Lis : 1<sup>re</sup> base (ligne), 2<sup>e</sup> base (colonne), 3<sup>e</sup> base (dans la case).</p>';
}
function genSeq(r, opt){
  opt = opt||{}; const introns = opt.introns!==false;
  const n = 3+Math.floor(r()*3); const cod=['AUG']; for(let i=0;i<n;i++) cod.push(pick(r,SENSE)); cod.push(pick(r,['UAA','UAG','UGA']));
  const arnm = cod.join('');
  const exT = [...arnm].map(x=>R2D[x]).join('');
  let pieces=[exT];
  if(introns){ const k = r()<.5?2:3; const cuts=new Set(); while(cuts.size<k-1) cuts.add(3+Math.floor(r()*(exT.length-6))); const cs=[...cuts].sort((a,b)=>a-b); pieces=[]; let p=0; cs.forEach(c=>{pieces.push(exT.slice(p,c)); p=c;}); pieces.push(exT.slice(p)); }
  const segs=[]; pieces.forEach((p,i)=>{ segs.push({t:'exon',s:p}); if(i<pieces.length-1){ let s=''; const L=4+Math.floor(r()*5); for(let j=0;j<L;j++) s+=pick(r,['A','C','G','T']); segs.push({t:'intron',s}); } });
  const transcrit = segs.map(x=>x.s).join('');
  const prearn = [...transcrit].map(x=>D2R[x]).join('');
  const nontr = [...transcrit].map(x=>DD[x]).join('');
  const prearnSegs = segs.map(x=>({t:x.t,s:[...x.s].map(y=>D2R[y]).join('')}));
  return {cod, arnm, segs, transcrit, nontr, prearn, prearnSegs, aas:cod.map(codonAA), introns};
}
const segHTML = (segs,ul) => segs.map(x=> x.t==='intron'&&ul ? '<u>'+x.s+'</u>' : x.s).join('');
function diffHTML(ans, exp){ ans=(ans||'').toUpperCase().replace(/[^A-Z]/g,''); let h=''; for(let i=0;i<Math.max(ans.length,exp.length);i++){ const a=ans[i]||'∅'; h += (a===exp[i]) ? a : '<span class="bad">'+a+'</span>'; } return h; }

/* ---------- Schémas SVG ---------- */
function arrowHead(x1,y1,x2,y2,k){ const a=Math.atan2(y2-y1,x2-x1), L=12, w=6; const bx=x2-L*Math.cos(a), by=y2-L*Math.sin(a); const px=-Math.sin(a)*w, py=Math.cos(a)*w; return '<polygon class="arrh" points="'+x2+','+y2+' '+(bx+px)+','+(by+py)+' '+(bx-px)+','+(by-py)+'"/>'; }
function shapeSVG(s){
  const k = s.k||''; const d = s.dash?' stroke-dasharray="5 4"':'';
  switch(s.t){
    case 'r': return '<rect class="'+k+'" x="'+s.x+'" y="'+s.y+'" width="'+s.w+'" height="'+s.h+'" rx="'+(s.rx||0)+'"'+d+'/>';
    case 'e': return '<ellipse class="'+k+'" cx="'+s.cx+'" cy="'+s.cy+'" rx="'+s.rx+'" ry="'+s.ry+'"/>';
    case 'c': return '<circle class="'+k+'" cx="'+s.cx+'" cy="'+s.cy+'" r="'+s.r+'"'+d+'/>';
    case 'p': return '<path class="'+k+'" d="'+s.d+'"/>';
    case 'l': { let h='<line class="'+(k||'arr')+'" x1="'+s.x1+'" y1="'+s.y1+'" x2="'+s.x2+'" y2="'+s.y2+'"/>'; if(s.a) h+=arrowHead(s.x1,s.y1,s.x2,s.y2,k); return h; }
    case 't': return '<text class="'+k+'" x="'+s.x+'" y="'+s.y+'" font-size="'+(s.size||13)+'" text-anchor="'+(s.anchor||'start')+'"'+(s.bold?' font-weight="700"':'')+'>'+esc(s.s)+'</text>';
  }
  return '';
}
function labelBox(l, fs){
  const lines=l.t.split('|'); const w=Math.max(...lines.map(x=>x.length))*fs*0.52+14, h=lines.length*(fs+3)+8; return {lines,w,h};
}
/* mode : ref | mem | complete | hl ; opts: {lvl, hide:Set(ids masqués), miss:Set(ids manquants), nums:{id:n}} */
function svgSchema(sc, mode, opts){
  opts=opts||{}; const [W,H]=sc.vb; const fs=11.5;
  let h='<svg class="sv" viewBox="0 0 '+W+' '+(H+34)+'" role="img" aria-label="'+esc(sc.titre)+'">';
  h+='<g transform="translate(0,34)">'+sc.shapes.map(shapeSVG).join('')+'</g>';
  const showTitle = (mode==='ref'||mode==='hl'||mode==='mem'&&opts.title);
  if(showTitle) h+='<text class="title" x="'+W/2+'" y="22" font-size="16" text-anchor="middle">'+esc(sc.titreAttendu||sc.titre)+'</text>';
  else h+='<text x="'+W/2+'" y="22" font-size="13" text-anchor="middle" style="opacity:.5">'+(mode==='complete'?'(titre à retrouver)':'')+'</text>';
  let leads='', labs='';
  sc.labels.forEach(l=>{
    const ess=!!l.ess; const masked = mode==='complete' && ess && (opts.lvl===2 || l.l1);
    if(mode==='mem' && !ess) return;
    const bx=labelBox(l,fs); const x=l.x, y=l.y+34;
    if(l.tgt) leads+='<line class="lead" x1="'+x+'" y1="'+y+'" x2="'+l.tgt[0]+'" y2="'+(l.tgt[1]+34)+'"/><circle cx="'+l.tgt[0]+'" cy="'+(l.tgt[1]+34)+'" r="2.6" fill="var(--sv-line)"/>';
    const miss = opts.miss && opts.miss.has(l.id);
    if(masked){ labs+='<g class="num"><circle cx="'+x+'" cy="'+y+'" r="12"/><text x="'+x+'" y="'+(y+4.5)+'" font-size="13" text-anchor="middle">'+opts.nums[l.id]+'</text></g>'; return; }
    if(l.bare){ labs+='<g>'+bx.lines.map((t,i)=>'<text x="'+x+'" y="'+(y-(bx.lines.length-1)*(fs+3)/2+i*(fs+3)+4)+'" font-size="'+fs+'" text-anchor="middle" style="opacity:.8">'+esc(t)+'</text>').join('')+'</g>'; return; }
    labs+='<g class="lab'+(miss?' miss':'')+'"><rect x="'+(x-bx.w/2)+'" y="'+(y-bx.h/2)+'" width="'+bx.w+'" height="'+bx.h+'" rx="7"/>'+bx.lines.map((t,i)=>'<text x="'+x+'" y="'+(y-(bx.lines.length-1)*(fs+3)/2+i*(fs+3)+4)+'" font-size="'+fs+'" text-anchor="middle"'+(ess?' font-weight="700"':'')+'>'+esc(t)+'</text>').join('')+'</g>';
  });
  return h+leads+labs+'</svg>';
}
const essOf = (sc,lvl) => sc.labels.filter(l=>l.ess && (lvl===2||l.l1));
function matchLabel(inp, l){
  const a=norm(inp); if(!a) return false; const cands=[l.t.replace(/\|/g,' ')].concat(l.alts||[]).map(norm);
  return cands.some(c=> a===c || (c.length>=5 && Math.abs(c.length-a.length)<=Math.max(2,c.length*0.3) && lev(a,c)<=Math.max(1,Math.floor(c.length/6))) || (a.length>=5 && c.includes(a) && a.length>=c.length*0.7));
}

const PADS = {};
function mountPad(el, key, penGetter){
  const cv=document.createElement('canvas'); cv.className='pad'; el.appendChild(cv);
  const st = PADS[key] || (PADS[key]={strokes:[]}); const ctx=cv.getContext('2d'); let cur=null;
  function size(){ const w=el.clientWidth||600, dpr=window.devicePixelRatio||1; cv.width=w*dpr; cv.height=Math.round(w*0.72)*dpr; cv.style.height=Math.round(w*0.72)+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); redraw(); }
  function redraw(){ const w=cv.clientWidth, h=cv.clientHeight; ctx.fillStyle='#fffdf8'; ctx.fillRect(0,0,w,h); ctx.strokeStyle='#dfe5f3'; ctx.lineWidth=1; for(let y=24;y<h;y+=24){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
    st.strokes.forEach(s=>{ ctx.strokeStyle=s.c; ctx.lineWidth=s.w; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath(); s.p.forEach((p,i)=>{ const x=p[0]*w,y=p[1]*h; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); if(s.p.length===1) ctx.lineTo(s.p[0][0]*w+.1,s.p[0][1]*h); ctx.stroke(); }); }
  const pos = e => { const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]; };
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); try{cv.setPointerCapture(e.pointerId);}catch(_){} const pen=penGetter(); cur={c:pen.c,w:pen.w,p:[pos(e)]}; st.strokes.push(cur); redraw(); });
  cv.addEventListener('pointermove',e=>{ if(!cur) return; cur.p.push(pos(e)); redraw(); });
  const end=()=>{ cur=null; }; cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  size(); window.addEventListener('resize',size,{once:true});
  return {undo(){ st.strokes.pop(); redraw(); }, clear(){ st.strokes.length=0; redraw(); }};
}

function mQcm(){

    const ok=M.res.filter(r=>r.ok).length; done('qcm');

  }
  const it=M.items[M.i], q=L.qcm[it.i];

  return h+'</div>';
}

const SEQ_STEPS=['Transcription','Maturation','Codons','Acides aminés','Schéma bilan'];
function seqModelSVG(g, title){
  const ch=8.6, mx=70; const W=640; const T=(x,y,s,o)=>'<text x="'+x+'" y="'+y+'" font-size="'+(o&&o.fs||13)+'" '+(o&&o.a?'text-anchor="'+o.a+'" ':'')+(o&&o.b?'font-weight="700" ':'')+(o&&o.c?'style="fill:'+o.c+'" ':'')+'>'+esc(s)+'</text>';
  const mono = (x,y,segs,cls)=>{ let cx=x,h=''; segs.forEach(sg=>{ h+='<text x="'+cx+'" y="'+y+'" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" letter-spacing="1.2" '+(sg.t==='intron'?'style="fill:var(--sv-intron);font-weight:700" ':(cls?'style="fill:'+cls+'" ':''))+'>'+sg.s+'</text>'; if(sg.t==='intron') h+='<line x1="'+cx+'" y1="'+(y+4)+'" x2="'+(cx+sg.s.length*ch)+'" y2="'+(y+4)+'" stroke="var(--sv-intron)" stroke-width="3"/>'; cx+=sg.s.length*ch; }); return h; };
  let h='<svg class="sv" viewBox="0 0 '+W+' 470" role="img" aria-label="Schéma modèle de la séquence">';
  h+=T(W/2,22,title||'De la séquence d\'ADN à la protéine',{a:'middle',b:1,fs:16});
  h+='<rect x="'+mx+'" y="36" width="560" height="120" rx="8" fill="var(--sv-nuc)" opacity=".55"/>'+T(mx+8,52,'Dans le noyau',{fs:12,b:1});
  h+=T(8,70,'Transcription',{fs:12,b:1}).replace('<text','<text transform="rotate(0)"');
  h+=T(mx+8,76,'ADN : brin transcrit (non codant)',{fs:12});
  h+=mono(mx+8,94,g.segs); h+=T(mx+8,114,'↓ ARN polymérase (complémentarité : A–U, T–A, C–G, G–C)',{fs:12});
  h+=T(mx+8,134,'ARN pré-messager',{fs:12})+mono(mx+8,150,g.prearnSegs.map(s=>({t:s.t==='intron'?'intron':'exon',s:s.s})),'var(--sv-rna)');
  h+='<rect x="'+mx+'" y="162" width="560" height="96" rx="8" fill="var(--sv-nuc)" opacity=".55"/>'+T(8,200,'Maturation',{fs:12,b:1});
  h+=T(mx+8,180,'Épissage : les introns (soulignés) sont éliminés',{fs:12});
  h+=T(mx+8,208,'ARN messager (exons seulement)',{fs:12})+mono(mx+8,228,[{t:'exon',s:g.arnm}],'var(--sv-rna)');
  h+=T(mx+8,248,'↓ sort du noyau par un pore nucléaire',{fs:12});
  h+='<rect x="'+mx+'" y="268" width="560" height="190" rx="8" fill="var(--sv-cell)" opacity=".8"/>'+T(mx+8,284,'Dans le cytoplasme (ribosome)',{fs:12,b:1})+T(8,330,'Traduction',{fs:12,b:1});
  let cx=mx+10; g.cod.forEach((c,i)=>{ const w=3*ch+10; h+='<rect x="'+cx+'" y="296" width="'+w+'" height="26" rx="4" fill="'+(i===0?'var(--sv-a1)':i===g.cod.length-1?'var(--sv-a4)':'var(--sv-a3)')+'" stroke="var(--sv-line)"/>'+'<text x="'+(cx+w/2)+'" y="314" font-size="13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-weight="700">'+c+'</text>'; cx+=w+3; });
  h+=T(mx+10,342,'codon d\'initiation',{fs:11});
  cx=mx+10; const pr=g.aas.slice(0,-1); pr.forEach((a,i)=>{ const x=cx+i*58+24; h+='<circle cx="'+x+'" cy="388" r="22" fill="var(--sv-a'+(i%4+1)+')" stroke="var(--sv-line)"/><text x="'+x+'" y="393" font-size="13" font-weight="700" text-anchor="middle">'+a+'</text>'; if(i) h+='<line x1="'+(x-58+22)+'" y1="388" x2="'+(x-22)+'" y2="388" stroke="var(--sv-line)" stroke-width="5"/>'; });
  h+=T(mx+10,434,'liaisons peptidiques entre les acides aminés · 1 codon = 1 acide aminé',{fs:11})+T(mx+10,450,'codon stop ('+g.cod[g.cod.length-1]+') : la traduction s\'arrête · protéine finale : '+pr.join('–'),{fs:11});
  return h+'</svg>';
}
const SEQ_CHECK=['Un titre','ADN dans le noyau, brin non codant (transcrit) indiqué','Transcription nommée, ARN pré-messager (complémentaire)','Introns repérés','Épissage (introns éliminés), ARN messager','L\'ARN sort du noyau vers le cytoplasme','Ribosome dans le cytoplasme, traduction nommée','Codons de 3 nucléotides, acides aminés (code génétique)','Liaisons peptidiques','Codon stop','Protéine finale'];

  } else if(p===2){
    h+='<div class="tag">2 — Préparation · les idées-clés (connaissances)</div><p>Coche ce que tu sais expliquer <b>sans regarder</b>. Ce que tu ne coches pas, va le revoir dans les fiches.</p>'+T.connaissances.map((c,i)=>chk('conn',i,c)).join('');
  } else if(p===3){

  } else if(p===4){
    h+='<div class="tag">2 — Préparation · les schémas</div><p>Si un schéma est demandé, il faut absolument le faire. Ici, lequel mettrais-tu en schéma bilan ?</p>'+T.schemas.map(id=>{ const sc=SCH(id); return chk('sch',id,sc.titreCourt)+'<div class="svwrap" style="margin:6px 0 12px">'+svgSchema(sc,'ref')+'</div>'; }).join('');
  } else if(p===5){
    h+='<div class="tag">2 — Préparation · le plan</div><p>À partir de ces idées clés, conçois un <b>plan avec des sous-parties</b> (2 ou 3 parties).</p><textarea data-in="t1t" data-k="plan" placeholder="1. …&#10;2. …&#10;3. …">'+esc(s.plan)+'</textarea>';
    h+=M.sel.plan?'<div class="fb info"><b>Un plan possible</b><ul style="margin:6px 0 0;padding-left:18px">'+T.plan.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>':'<div class="row" style="margin-top:12px"><button class="btn ghost" data-act="t1plan">Comparer avec un plan possible</button></div>';
  } else if(p===6){
    h+='<div class="tag">3 — Rédaction · 1. Introduction</div><div class="stack"><div class="step"><i>1</i><div>définir les mots clés du sujet</div></div><div class="step"><i>2</i><div>écrire le problème à résoudre (souvent donné dans la question)</div></div><div class="step"><i>3</i><div>présenter <b>obligatoirement</b> le plan choisi pour y répondre</div></div></div><textarea data-in="t1t" data-k="intro" placeholder="Mon introduction…">'+esc(s.intro)+'</textarea>';

  } else if(p===8){
    h+='<div class="tag">3 — Rédaction · 3. Conclusion</div><div class="stack"><div class="step"><i>1</i><div>résumer la réponse au problème</div></div><div class="step"><i>2</i><div>faire éventuellement un schéma bilan</div></div><div class="step"><i>3</i><div>ouvrir si possible sur un autre sujet</div></div></div><textarea data-in="t1t" data-k="concl" placeholder="Ma conclusion…">'+esc(s.concl)+'</textarea>'+(M.sel.c?'<div class="fb info"><b>Conclusion possible :</b> '+esc(T.conclusion)+'</div>':'<div class="row" style="margin-top:12px"><button class="btn ghost" data-act="t1c">Comparer avec une conclusion possible</button></div>');

  } else {
    const gq=[['q1','Ma réponse traite la question posée (je n\'ai pas seulement récité mon cours).'],['q2','Toutes les grandes idées sont présentes.'],['q3','Mes connaissances et arguments sont exacts.'],['q4','Mes connaissances et arguments sont complets.'],['q5','Ils sont bien mis en relation, avec une organisation cohérente.']];

    const g=s.g; let band,pts; if(!g.q1){band=4;pts='2 – 0';} else if(!g.q2){ band=3; pts= g.q3?'5 – 4':'3 – 2'; } else if(g.q3&&g.q4&&g.q5){band=1;pts='10 – 9';} else if(g.q3&&g.q4){band=2;pts='8 – 7';} else if(g.q3){band=2;pts='7 – 6';} else {band=3;pts='5 – 2';}

  return h;

function buildTest(seed){ const L=curL(), r=rngOf(seed); const core=L.notions.filter(n=>n.core&&['genotype','phenotype','homozygote','heterozygote','allele','dominant','recessif','codon','codegen','transcription','traduction','maturation'].includes(n.id)); const defs=shuffle(r,core).slice(0,3); const cas=pick(r,L.cas); return {seed,defs,cas,g:genSeq(rngOf(seed+1),{introns:true})}; }
function testSujet(T){
  const L=curL(); let h='<div class="sheet card"><h3 style="margin-top:0">Évaluation Spécialité SVT 1<sup>re</sup> – Test de connaissances</h3><p><b>1 – Définir les termes suivants :</b></p>'+T.defs.map(d=>'<p>– '+esc(d.mot)+' : ………………………………………………………</p>').join('');
  h+='<p><b>2 – À partir du texte suivant, complète le tableau sur les échelles du phénotype :</b> '+esc(T.cas.titre)+'</p><p class="small">'+esc(T.cas.intro)+'</p><div class="scroll"><table class="t"><tr><th>Les échelles du phénotype</th><th>'+esc(T.cas.col[0])+'</th><th>'+esc(T.cas.col[1])+'</th></tr>'+['macroscopique','cellulaire','moléculaire'].map(e=>'<tr><td>Échelle '+e+'</td><td style="height:56px"></td><td></td></tr>').join('')+'</table></div>';
  h+='<p><b>3 – Détermine la séquence de la protéine correspondant à la séquence d\'ADN (brin non-codant) ci-dessous.</b> Les introns sont soulignés, les exons ne le sont pas. Tu feras un schéma et indiqueras toutes les étapes de ta réflexion (sans représenter la cellule), en localisant et nommant chaque étape.</p><p class="seq">'+segHTML(T.g.segs,true)+'</p><details><summary>Tableau du code génétique (fourni)</summary>'+codeTable()+'</details></div>';
  return h;
}
function testCorr(T){

  h+='<p><b>2 – Échelles du phénotype</b></p><div class="scroll"><table class="t"><tr><th></th>'+T.cas.col.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>'+T.cas.rows.filter(r=>r.e!=='génotype').map(r=>'<tr><td><b>'+esc(r.e)+'</b></td>'+r.m.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</table></div>';
  h+='<p><b>3 – Séquence</b></p><p>ARN pré-messager : <span class="seq">'+g.prearn+'</span><br>ARN messager (sans introns) : <span class="seq">'+g.arnm+'</span><br>Codons : <span class="seq">'+g.cod.join(' ')+'</span><br>Protéine : <b>'+g.aas.slice(0,-1).join(' – ')+'</b> (puis codon stop '+g.cod[g.cod.length-1]+')</p><div class="svwrap">'+seqModelSVG(g)+'</div></div>';
  return h;
}

/* ---------- Erreurs ---------- */
function vErr(){
  const P=S.P, open=P.err.filter(e=>!e.fixed), fixed=P.err.filter(e=>e.fixed);
  let h='<div class="tag">Mes erreurs</div><h2>Je les utilise, je ne les subis pas.</h2><p class="muted">Chaque erreur est un point précis à retravailler. Quand tu la corriges, tu la coches.</p>';
  const cnt={}; open.forEach(e=>cnt[e.c]=(cnt[e.c]||0)+1);
  if(!open.length) h+='<div class="fb good">Aucune erreur ouverte pour l\'instant.</div>';
  Object.entries(cnt).sort((a,b)=>b[1]-a[1]).forEach(([c,n])=>{ const E=ERRS[c]; h+='<div class="card"><div class="row" style="justify-content:space-between"><b><span class="err-c" style="display:inline-flex;margin-right:8px">'+c+'</span>'+esc(E.n)+' · '+n+'</b><button class="btn ghost sm" data-act="start" data-a="'+esc(E.go)+'">'+esc(E.goT)+'</button></div><p class="small muted" style="margin:8px 0 0">'+esc(E.tip)+'</p>'+open.filter(e=>e.c===c).map(e=>'<div class="err-i"><div style="flex:1;min-width:0">'+esc(e.t)+'<div class="small muted">'+(e.src==='test'?'test de septembre':'ajoutée le '+fmtDate(e.d))+'</div></div><button class="btn ghost sm" data-act="efix" data-a="'+e.id+'">Corrigée ✓</button></div>').join('')+'</div>'; });
  if(fixed.length) h+='<details><summary>Corrigées ('+fixed.length+')</summary>'+fixed.map(e=>'<div class="err-i fixed"><span class="err-c">'+e.c+'</span><div style="flex:1">'+esc(e.t)+'</div><button class="btn ghost sm" data-act="eun" data-a="'+e.id+'">Rouvrir</button></div>').join('')+'</details>';
  return h;
}

 +'@page{size:A4;margin:14mm}*{box-sizing:border-box}body{font:12pt/1.45 "Atkinson Hyperlegible",Arial,sans-serif;color:#1d2433;margin:0;background:#fff}.page{page-break-after:always;padding:2mm}h1{font-size:19pt;margin:0 0 4px}h2{font-size:15pt;margin:0 0 6px}h3{font-size:12.5pt;margin:12px 0 5px}.tag{font-size:8.5pt;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:#2b4a8b}.def{padding:5px 0;border-bottom:1px dashed #cfc8b5}.def .m{font-weight:700}.piege{display:none}.blank{display:inline-block;border-bottom:1.5px solid #333;min-width:5em}b.kw{color:#2b4a8b}table.t{border-collapse:collapse;width:100%;font-size:10.5pt}table.t th,table.t td{border:1px solid #888;padding:5px 7px;text-align:left;vertical-align:top}table.t th{background:#eef2fb}.concl{border:1.5px solid #b3321f;background:#fff1ee;padding:7px 10px;margin:9px 0}.concl:before{content:"Conclusion : ";font-weight:700;color:#b3321f}.ret{border:1.5px dashed #2b4a8b;padding:6px 10px;margin:9px 0;font-weight:700}.ex{background:#e9f6ee;padding:6px 10px;margin:8px 0}.eq{text-align:center;font-weight:700;padding:7px;background:#eef2fb;margin:9px 0}.step{display:flex;gap:7px;margin-bottom:5px}.step i{font-style:normal;font-weight:700;background:#2b4a8b;color:#fff;border-radius:50%;min-width:20px;height:20px;text-align:center;font-size:9pt;line-height:20px}.sv{width:100%;max-width:170mm;display:block;margin:6px auto}.svwrap{border:1px solid #ccc;padding:3px}.seq{font-family:Consolas,Menlo,monospace;letter-spacing:.1em}.seq u{text-decoration-thickness:2px}.sheet,.card{margin:6px 0}.sv text{fill:#1d2433}.sv .cell{fill:#fbf1d8;stroke:#5b6578;stroke-width:2}.sv .nuc{fill:#dbe8f8;stroke:#2f5fa8;stroke-width:3}.sv .pore{fill:#dbe8f8}.sv .dna{fill:none;stroke:#2f5fa8;stroke-width:3}.sv .dnaLine{stroke:#2f5fa8;stroke-width:5}.sv .dnaA{fill:none;stroke:#2f5fa8;stroke-width:4}.sv .dnaB{fill:none;stroke:#5b6578;stroke-width:4}.sv .rung{stroke:#5b6578;stroke-width:2}.sv .gene{fill:none;stroke:#5b6578;stroke-dasharray:5 4;stroke-width:2}.sv .rna{fill:none;stroke:#c8452e;stroke-width:3.5}.sv .rnaThick{fill:none;stroke:#c8452e;stroke-width:5}.sv .rnaLine{stroke:#c8452e;stroke-width:4}.sv .txtR{fill:#c8452e}.sv .ribo,.sv .enz{fill:#e4defa;stroke:#7a68b8;stroke-width:2.5}.sv .site{fill:none;stroke:#7a68b8;stroke-dasharray:6 4;stroke-width:2}.sv .aa1{fill:#f2c14e;stroke:#5b6578}.sv .aa2{fill:#86c08a;stroke:#5b6578}.sv .aa3{fill:#74afdc;stroke:#5b6578}.sv .aa4{fill:#e993a8;stroke:#5b6578}.sv .exon{fill:#c8452e;stroke:#5b6578}.sv .intron{fill:#eba938;stroke:#5b6578}.sv .intronLine,.sv .lasso{fill:none;stroke:#eba938;stroke-width:8}.sv .boxG{fill:#ffe3df;stroke:#c0392b;stroke-width:3}.sv .boxB{fill:#e1eaff;stroke:#2b4a8b;stroke-width:3}.sv .big{stroke:#5b6578;stroke-width:6}.sv .env{stroke:#5b6578;stroke-width:3;stroke-dasharray:3 6}.sv .chrP{fill:#9bbdea;stroke:#5b6578}.sv .chrM{fill:#eab0a4;stroke:#5b6578}.sv .bandA{fill:#1d2433}.sv .bandB{fill:#8e44ad}.sv .loc{stroke:#5b6578;stroke-dasharray:3 5}.sv .codonS{fill:#f2c14e;stroke:#5b6578}.sv .codon{fill:#74afdc;stroke:#5b6578}.sv .codonX{fill:#e993a8;stroke:#5b6578}.sv .bond{stroke:#5b6578;stroke-width:6}.sv .arr{stroke:#5b6578;stroke-width:3}.sv .arrh{fill:#5b6578}.sv .lab rect{fill:#fff;stroke:#5b6578}.sv .lead{stroke:#5b6578}.sv .num circle{fill:#2b4a8b}.sv .num text{fill:#fff}.chk{display:flex;gap:7px;margin:4px 0}.small{font-size:10pt}.muted{color:#4b5568}.bank span{border:1px solid #aaa;border-radius:6px;padding:2px 7px;margin:2px;display:inline-block;font-size:10pt}.nt{margin:4px 0}.line{border-bottom:1px solid #777;height:22px}';
function docFrame(title, body, note){ return '<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>'+DOC_CSS+'</style></head><body>'+body+'<p class="small muted" style="text-align:center">'+esc(note||'')+'</p></body></html>'; }
function docFiches(mode){
  const L=curL(); let b='<div class="page"><div class="tag">'+esc(L.theme)+'</div><h1>'+esc(L.titre)+'</h1><p><b>Objectif :</b> '+esc(L.objectif)+'</p><p><b>Problématique :</b> '+esc(L.problematique)+'</p><h3>Je dois être capable de…</h3>'+L.capacites.map(c=>'<div class="chk">☐ <span>'+esc(c)+'</span></div>').join('')+(mode==='trous'?'<p class="small muted"><b>Version élève : à compléter.</b> Les mots-clés sont masqués ; les schémas sont à remplir (numéros) puis à redessiner de mémoire.</p>':'')+'</div>';
  L.fiches.forEach(f=>{ b+='<div class="page"><div class="tag">Fiche '+(L.fiches.indexOf(f)+1)+'</div><h2>'+esc(f.titre)+'</h2><p class="small"><b>Objectif :</b> '+esc(f.mission)+'</p>'+f.blocs.map(bl=>blocHTML(bl,mode==='trous'?'trous':'')).join('');
    (f.schemas||[]).forEach(id=>{ const sc=SCH(id); if(!sc) return; if(mode==='trous'){ const hid=essOf(sc,2), nums={}; hid.forEach((l,i)=>nums[l.id]=i+1); b+='<h3>Schéma à compléter : '+esc(sc.titreCourt)+'</h3><div class="svwrap">'+svgSchema(sc,'complete',{lvl:2,nums})+'</div>'+hid.map(l=>'<div class="nt">'+nums[l.id]+'. ………………………………………………</div>').join('')+'<p class="small"><b>Titre du schéma :</b> ………………………………………………………………………</p>'; } else b+='<h3>Schéma : '+esc(sc.titreCourt)+'</h3><div class="svwrap">'+svgSchema(sc,'ref')+'</div>'; });
    b+='</div>'; });
  return b;
}
async function download(kind){
  const L=curL(); const msg=$('#dlmsg'); let html,name;
  if(kind==='full'){ html=docFrame('Fiches – '+L.titre, docFiches('full'), 'Fiches complètes · '+L.titre); name='fiches-complètes-'+L.id+'.html'; }
  else if(kind==='trous'){ html=docFrame('Fiches à compléter – '+L.titre, docFiches('trous'), 'Version élève à compléter'); name='fiches-à-compléter-élève-'+L.id+'.html'; }
  else if(kind==='corr'){ html=docFrame('Correction – '+L.titre, docFiches('full'), 'Correction : compare avec ta version complétée'); name='fiches-correction-'+L.id+'.html'; }
  else if(kind==='sujet'&&S.test){ html=docFrame('Test blanc – sujet', '<div class="page">'+testSujet(S.test.T)+'</div>', 'Test blanc – version élève'); name='test-blanc-sujet.html'; }
  else if(kind==='tcorr'&&S.test){ html=docFrame('Test blanc – correction', '<div class="page">'+testCorr(S.test.T)+'</div>', 'Test blanc – correction'); name='test-blanc-correction.html'; }
  else return;
  try{ const dl = window.claude ? await window.claude.use('downloads') : null; if(!dl){ if(msg) msg.textContent='Le téléchargement n\'est pas disponible ici.'; return; } await dl.save({filename:name, data:html}); if(msg) msg.textContent='Fichier prêt : ouvre-le puis « Imprimer ».'; }catch(e){ if(msg) msg.textContent = (e&&e.code==='declined') ? 'Téléchargement annulé.' : 'Le téléchargement a échoué.'; }
}

/* ---------- Actions ---------- */
const ACT = {
  tab(a){ S.view=a; S.test=null; if(a==='exos'&&S.m&&S.m.key==='x') S.m=null; render(); window.scrollTo(0,0); },
  start(a){ startMission(a); },
  menu(){ S.m=null; S.view='exos'; render(); window.scrollTo(0,0); },
  again(){ S.m.queue=curL().notions.filter(n=>n.core).sort(()=>Math.random()-.5).slice(0,5).map(n=>n.id); S.m.i=0; S.m.res=[]; render(); },
  fi(a){ S.fi=+a; render(); window.scrollTo(0,0); },
  cap(a,b){ S.P.cap[a]=+b; save(); render(); },
  dl(a){ download(a); },
  show(){ S.m.shown=true; render(); },
  grade(a){ const M=S.m, n=NOT(M.queue[M.i]), c=card(n.id); c.n++; if(a==='ok'){ c.box=Math.min(5,c.box+1); fixErr('D',n.id); } else if(a==='half'){ c.box=Math.max(1,c.box); } else { c.box=1; addErr('D','Définition à revoir : '+n.mot,n.id); } c.due=addDays(INT[c.box]||0); M.res.push(a); M.i++; M.shown=false; M.typed=''; save(); render(); window.scrollTo(0,0); },
  sstep(a){ S.m.step=+a; render(); window.scrollTo(0,0); },
  shide(){ S.m.hid=!S.m.hid; render(); },
  slvl(a){ S.m.lvl=+a; S.m.checked=false; S.m.ans={}; render(); },
  sbank(){ S.m.bank=!S.m.bank; render(); },
  sredo(){ S.m.checked=false; S.m.ans={}; render(); },
  scheck(){ const M=S.m, sc=SCH(M.key.slice(7)); M.checked=true; essOf(sc,M.lvl).forEach(l=>{ if(!matchLabel(M.ans[l.id]||'',l)) addErr('S','Légende oubliée ou fausse (« '+l.t.replace(/\|/g,' ')+' ») sur le schéma « '+sc.titreCourt+' »',sc.id); }); save(); render(); },
  pundo(){ window._pad&&window._pad.undo(); },
  pclear(){ window._pad&&window._pad.clear(); },
  ppen(a){ S.m.pen=a; },
  svalid(){ const M=S.m, sc=SCH(M.key.slice(7)); M.valid=true; if(!M.ticks.__titre) addErr('T','Titre oublié sur le schéma « '+sc.titreCourt+' »',sc.id); essOf(sc,2).forEach(l=>{ if(!M.ticks[l.id]) addErr('S','Élément manquant « '+l.t.replace(/\|/g,' ')+' » sur le schéma « '+sc.titreCourt+' »',sc.id); else fixErr('S',sc.id); }); if(M.ticks.__titre) fixErr('T',sc.id); save(); render(); },
  sfinish(){ const M=S.m, id=M.key.slice(7), sc=SCH(id), ess=essOf(sc,2); const all=Object.keys(M.ticks).filter(k=>M.ticks[k]).length>=ess.length+1; S.P.redo[id]=addDays(all?7:2); done(M.key); S.m=null; render(); window.scrollTo(0,0); },
  qpick(a){ const M=S.m, L=curL(), it=M.items[M.i], q=L.qcm[it.i]; M.pk=+a; const ok=M.pk===q.b; const st=S.P.q[it.i]||(S.P.q[it.i]={ok:0,ko:0}); ok?st.ok++:st.ko++; M.res.push({i:it.i,ok}); if(!ok) addErr(q.code,'QCM : '+q.q,q.ref); else fixErr(q.code,q.ref); save(); render(); },
  qnext(){ S.m.i++; S.m.pk=null; render(); window.scrollTo(0,0); },
  eshow(){ S.m.shown=true; render(); },
  egrade(a){ const M=S.m, cas=curL().cas.find(c=>c.id===M.key.slice(9)), r=cas.rows[M.r]; M.res.push(a); if(a!=='ok') addErr('E','Échelle '+r.e+' ('+cas.titre+')','echelles'); else fixErr('E','echelles'); M.r++; M.shown=false; save(); render(); window.scrollTo(0,0); },
  svar(a){ const M=S.m; startSeq({variant:a,introns:M.introns}); render(); },
  sintr(){ const M=S.m; startSeq({variant:M.variant,introns:!M.introns}); render(); },
  snew(){ const M=S.m; startSeq({variant:M.variant,introns:M.introns}); render(); },
  sver(){ const M=S.m, g=M.g, st=M.step; const exp=[g.prearn,g.arnm,g.cod.join(' '),g.aas.map((a,i)=>i===g.aas.length-1?'Stop':a).join(' ')][st]; let a=(M.ans[st]||''); let ok; if(st<2) ok=a.toUpperCase().replace(/[^A-Z]/g,'')===exp; else if(st===2) ok=a.toUpperCase().trim().split(/[\s,;-]+/).join(' ')===exp; else { const t=a.trim().split(/[\s,;-]+/).map(x=>{ const n=norm(x); const k=Object.keys(AAFR).find(z=>norm(z)===n||norm(AAFR[z])===n); return k||x; }); ok=t.join(' ')===exp; } M.ok[st]=ok; if(!ok) addErr('C',['Transcription : complémentarité (U à la place de T)','Maturation : retirer les introns','Découpage en codons de 3','Traduction : acides aminés avec le code génétique'][st],'seq'); else fixErr('C','seq'); save(); render(); },
  sshow(){ const M=S.m; M.ok[M.step]=false; addErr('C',['Transcription : complémentarité (U à la place de T)','Maturation : retirer les introns','Découpage en codons de 3','Traduction : acides aminés avec le code génétique'][M.step],'seq'); save(); render(); },
  snext(){ S.m.step++; render(); window.scrollTo(0,0); },
  sfin(){ const M=S.m; if(Object.values(M.ticks).filter(Boolean).length<SEQ_CHECK.length){ SEQ_CHECK.forEach((t,i)=>{ if(!M.ticks[i]) addErr(i===0?'T':'S','Schéma de la séquence : '+t.toLowerCase()+' (oublié)','seq'); }); } done('seq'); S.m=null; render(); window.scrollTo(0,0); },
  t1kw(a){ const s=t1State(+S.m.key.slice(3)); const i=s.kw.indexOf(a); i<0?s.kw.push(a):s.kw.splice(i,1); save(); render(); },
  t1v(){ S.m.sel.v=true; const T=curL().type1[+S.m.key.slice(3)], s=t1State(+S.m.key.slice(3)); if(T.motsClesPieges.some(w=>s.kw.includes(w))||!T.motsCles.every(w=>s.kw.includes(w))) addErr('L','Mots-clés du sujet mal repérés ('+T.titre+')','t1'); save(); render(); },
  t1plan(){ S.m.sel.plan=true; render(); },
  t1c(){ S.m.sel.c=true; render(); },
  t1go(a){ S.m.p=Math.max(0,Math.min(T1P.length-1,S.m.p+(+a))); render(); window.scrollTo(0,0); },
  t1fin(){ const i=+S.m.key.slice(3), s=t1State(i); if(!s.g.q1||!s.g.q2||!(s.g.q3&&s.g.q4&&s.g.q5)) addErr('O','Rédaction type 1 « '+curL().type1[i].titre+' » : à retravailler avec la grille','t1'); else fixErr('O','t1'); done(S.m.key); S.m=null; render(); window.scrollTo(0,0); },
  efix(a){ const e=S.P.err.find(x=>x.id===a); if(e) e.fixed=true; save(); render(); },
  eun(a){ const e=S.P.err.find(x=>x.id===a); if(e) e.fixed=false; save(); render(); },
  tstart(a){ S.test={mode:a,T:buildTest(Date.now()&0xffffff),corr:false,ticks:{},t0:Date.now()}; render(); window.scrollTo(0,0); },
  tnone(){ S.test=null; clearInterval(window._tt); render(); },
  tcorr(){ S.test.corr=true; render(); },
  tfin(){ const T=S.test.T, n=T.defs.length+3+SEQ_CHECK.length, ok=Object.values(S.test.ticks).filter(Boolean).length; S.P.tests.push({d:today(),ok,n,mode:S.test.mode}); [...Array(n).keys()].forEach(i=>{ if(!S.test.ticks[i]){ if(i<T.defs.length) addErr('D','Test blanc : définition « '+T.defs[i].mot+' »',T.defs[i].id); else if(i<T.defs.length+3) addErr('E','Test blanc : échelle du phénotype','echelles'); else addErr(i===T.defs.length+3?'T':'S','Test blanc, schéma : '+SEQ_CHECK[i-T.defs.length-3].toLowerCase(),'seq'); } }); save(); S.test=null; S.view='err'; render(); }
};
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el||el.disabled) return; const f=ACT[el.dataset.act]; if(f) f(el.dataset.a, el.dataset.b, el); });
document.addEventListener('input',e=>{ const el=e.target, w=el.dataset&&el.dataset.in; if(!w) return; const M=S.m;
  if(w==='typed') M.typed=el.value;
  else if(w==='ans') M.ans[el.dataset.k]=el.value;
  else if(w==='ech') M.ans[el.dataset.k]=el.value;
  else if(w==='sans') M.ans[el.dataset.k]=el.value;
  else if(w==='t1t'){ t1State(+M.key.slice(3))[el.dataset.k]=el.value; save(); }
});
document.addEventListener('change',e=>{ const el=e.target, w=el.dataset&&el.dataset.in; if(!w) return; const M=S.m;
  if(w==='tick'){ M.ticks[el.dataset.k]=el.checked; }
  else if(w==='stick'){ M.ticks[el.dataset.k]=el.checked; }
  else if(w==='t1c'){ const s=t1State(+M.key.slice(3)); s[el.dataset.g][el.dataset.k]=el.checked; save(); if(el.dataset.g==='g') render(); }
  else if(w==='ttick'){ S.test.ticks[el.dataset.k]=el.checked; }
});
$('#lsel').addEventListener('change',async e=>{ S.lid=e.target.value; lsSet('lid',S.lid); await loadProg(curL()); S.m=null; S.test=null; S.fi=-1; render(); });

/* ---------- Démarrage ---------- */
(async function(){
  await initStore(); await loadLessons();
  const last=lsGet('lid'); S.lid = (S.lessons.find(l=>l.id===last)||S.lessons[0]||{}).id;
  if(curL()){ await loadProg(curL()); S.fi=-1; save(); }
  render();
})();
</script>
